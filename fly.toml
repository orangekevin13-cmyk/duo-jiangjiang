# Duo 講講 · Cantonese SpeakOut Pass — Fly.io 設定
#
# 首次部署：
#   fly launch --no-deploy --copy-config
#   fly secrets set DEMO_PASSWORD=你的示範密碼
#   fly deploy
#   （開真實模型才需要：fly secrets set DEEPSEEK_API_KEY=sk-xxx 之後把 LIVE_ALLOWED 改成 "1"）
#
# ─────────────────────────────────────────────────────────────────────────────
# ⚠ 兩條唔可以改嘅硬規則
#
# 1) 必須只跑一個 instance。
#    會話狀態存喺進程記憶體（每位訪客一個 session）。如果 Fly 開多過一部機，
#    同一個訪客嘅請求會被分流去唔同機器，佢會見到進度突然消失或者跳返第一步。
#    下面已經用 min_machines_running = 1 + auto_stop_machines = false + auto_start_machines = false
#    鎖死「永遠一部、唔加唔減」。
#    如果你之後要水平擴展，一定要先把會話搬去 Redis 之類嘅共享存儲。
#
# 2) 保持 DEMO_MODE=mock、LIVE_ALLOWED=0（即下面嘅預設值）。
#    原因：呢個部署係俾老師評委自己開嘅，網址一定會流傳（貼群、轉發）。
#    mock 模式嘅工具調用、圍欄判定、動態碼核銷、獎勵計算全部照跑，
#    只有文案由模板生成 —— 演示效果一樣，但零成本、零等待、每次結果一致。
#    如果真要示範真實模型示範，先計好成本：
#      · 把 LIVE_ALLOWED 改成 "1"、DEMO_MODE 改成 live
#      · 收窄 RATE_PER_MIN（例如 6）作為成本閘門
#      · 示範完即刻改返：fly secrets set DEMO_MODE=mock LIVE_ALLOWED=0
# ─────────────────────────────────────────────────────────────────────────────
app = "duo-jiangjiang"
primary_region = "hkg" # 香港，粵語演示最貼題，延遲最低

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  # 離線確定性引擎：零成本、零等待。工具調用、圍欄判定、動態碼核銷、
  # City Stamp 獎勵全部照跑，只有文案由模板生成。
  # 想示範真實模型先改做 live，同時把 LIVE_ALLOWED 改成 "1"。
  DEMO_MODE = "mock"
  # 成本保險絲：只有 "1" 才會呼叫收費模型
  LIVE_ALLOWED = "0"
  # mock 模式即時回應，可以放寬；live 模式應該收窄（每次完整演示約 ¥0.1-0.3）
  RATE_PER_MIN = "40"
  GLOBAL_CONCURRENCY = "6"
  SESSION_TTL_MINUTES = "90"

[http_service]
  internal_port = 8080
  force_https = true
  # 三部鎖死：唔停機、唔自動開新機、永遠維持一部
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[[http_service.checks]]
  interval = "30s"
  timeout = "3s"
  grace_period = "5s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  # live 模式下每次模型調用會 hold 住請求幾秒，256MB 夠用；
  # 如果之後見到 OOM，加到 512mb。
  memory = "512mb"
